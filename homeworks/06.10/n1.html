<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: #014141;
            color: #ffff;
            width: 100%;
        }

        .text-n1 {
            color: rgba(168, 166, 166, 0.767);
        }

        .item {
            display: flex;
            flex-direction: column;
        }

        .label { 
            color: rgba(168, 166, 166, 0.767);
        }

        .value {
            color: #ffff;
        }


        @media (min-width: 601px) {
            .card {
                max-width: 720px;
                padding: 60px 50px ;
            }

            .text-n1 {
                margin-bottom: 20px;
                font-size: 14px
            }

            .title {
                font-size: 42px;
                max-width: 500px;
                line-height: 1.25;
            }

            .container {
                display: flex;
                align-items: center;
                gap: 25px;
            }

            .avatar {
                width: 60px;
                height: 60px;
                margin-top: 40px;
                margin-bottom: 35px;
            }

            .group {
                display: flex;
                gap: 30px;
            }

            .label {
                font-size: 13px;
                margin-bottom: 3px;
            }

            .value {
                font-size: 15px;
                display: inline-block;
            }


        }


        @media (max-width: 600px) {
            .card {
                max-width: 380px;
                padding: 30px 25px;
            }

            .text-n1 {
                font-size: 16px;
                margin-bottom: 18px;
            }

            .title {
                font-size: 28px;
                line-height: 1.3;
                margin-bottom: 30px;
            }

            .container {

                display: flex;
                align-items: flex-start;
                gap: 20px;
            
            }

            .avatar {
                width: 60px;
                height: 60px;
                margin-top: 11px;
                margin-bottom: 55px;
            }

            .group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px 20px;
                flex-grow: 1;
            }


            .value {
                font-size: 12px;
            }

            .label {
                font-size: 11px;
                margin-bottom: 2px;
            }



        }


    </style>
</head>
<body>
    <div class="card">
        <div class="text-n1">Home / Articles /</div>
        <h1 class="title">The Difference Between Respomsive and Adaptive Design</h1>        

        <div class="container">
            <img src="./resources/account.png" alt="avatar" class="avatar">

            <div class="group">
                <div class="item">
                    <span class="label">Author</span>
                    <span class="value">Geoff Graham</span>
                </div>

                <div class="item">
                    <span class="label">49 Comments</span>
                    <span class="value">Go to comments</span>
                </div>

                <div class="item">
                    <span class="label">Published</span>
                    <span class="value">Nov 11, 2018</span>
                </div>

                <div class="item">
                    <span class="label">Updated</span>
                    <span class="value">Nov 17, 2018</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

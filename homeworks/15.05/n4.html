<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol {
            display: inline-block;
        }
        .block {
            border: solid 1px #2b4f6f;
            background-color: #2b4f6f;
            width: 100%;
            height: 250px;
        }
        li {
            list-style-type: none;
            padding: 3px;
        }
        #ol-1 {
            color: white;
            margin-left: 70px;
            margin-top: 50px;

        }
        #ol-2 {
            vertical-align: top;
            color: white;
            margin-top: 50px;
            margin-left: 190px;

        }
        p {
            color: white;
            text-align: center;
            font-size: 13px;
        }
        /* img {
            width: 30px;
            height: 30px;
            float: right;
            margin-top: 80px;
            padding-right: 30px; */
            
        /* } */
        img, .img1, .img2, .img3 {
            width: 30px;
            height: 30px;
            float: right;
            margin-top: 80px;
            padding-right: 30px;

        }
        .img1 {
            margin-right: 35px;
            padding-left: 0px;
            background-image: url(./resuorces/youtube_gray.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .img3 {
            margin-right: 0px;
            padding-left: 0px;
            background-image: url(./resuorces/fb_gray.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .img2 {
            margin-right: 0px;
            padding-left: 0px;
            background-image: url(./resuorces/insta_gray.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .img1:hover {
            background-image: url(./resuorces/youtube.png);

        }
        .img3:hover {
            background-image: url(./resuorces/fb.png);

        }
        .img2:hover {
            background-image: url(./resuorces/insta.png);

        }
        li:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="block">
        <div class="img-container">
            <div class="img1"></div>
            <div class="img2"></div>
            <div class="img3"></div>
        </div>

        <ol id="ol-1">
            <li>Home</li>
            <li>About</li>
            <li>Gallery</li>
            <li>News</li>
        </ol>
        <ol id="ol-2">
            <li>Blog</li>
            <li>FAQ</li>
            <li>Contacts</li>
            <li>Privacy & cookies</li>
        </ol>
        <hr>
        <p>Copyright © Company 2018 - 2019</p>

    </div>
</body>
</html>

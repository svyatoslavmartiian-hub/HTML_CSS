<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-family: bold;
        }
        .header {
            border: solid 1px #923059;
            background-color: #923059;
            height: 70px;
            max-width: 100%;
            margin: 0;
            padding-top: 35px;
        }
        .header-text {
            color: white;
            font-size: 25px;
            margin: 70px;
        }
        .menu {
            margin-top: 10px;
            border: solid 1px #6e1237;
            background-color: #6e1237;
            height: 40px;
            max-width: 100%;
            padding-top: 20px;
            
        }
        .menu-text{
            color: white;
            font-size: 20px;
            padding-left: 70px;
        }
        .content-wrapper {
            margin-top: 10px;
            width: 100%;
        }
        .sidebar {
            display: inline-block;
            vertical-align: top;
            width: 250px;
        }
        
        .block1 {
            border: solid 1px #b65c82;
            background-color: #b65c82;
            height: 60px;
            width: 100%;
            padding-top: 30px;
            margin-bottom: 10px;
        }
        .aside1 {
            font-size: 20px;
            color: white;
            padding-left: 50px;

        }
        .block2 {
            border: solid 1px #b65c82;
            background-color: #b65c82;
            height: 120px;
            width: 100%;
            padding-top: 10px;

        }
        .aside2 {
            font-size: 20px;
            color: white;
            padding-left: 50px;

        }
        .block3 {
            vertical-align: top;
            border: solid 1px #b65c82;
            background-color: #b65c82;
            width: 130px;
            height: 270px;
            float: right;
        }
        .block4 {
            display: inline-block;
            vertical-align: top;
            border: solid 1px #b65c82;
            background-color: #b65c82;
            height: 330px;
            width: 1260px;
            padding-top: 30px;
            margin-bottom: 20px;
            margin-left: 5px;
        }
        .text4 {
            color: white;
            padding-left: 50px;
            margin-top: 100px;
            font-size: 20px;
        }
        .block5 {
            border: solid 1px #db92af;
            background-color: #db92af;
            width: 1160px;
            height: 105px;
            margin-left: 50px;
            margin-top: 15px;
            padding-top: 20px;

        }
        .block6 {
            border: solid 1px #db92af;
            background-color: #db92af;
            width: 1160px;
            height: 105px;
            margin-left: 50px;
            margin-top: 10px;
            padding-top: 20px;

        }
        .text {
            color: white;
            font-size: 25px;
            padding-left: 100px;

        }
        .Footer{
            color: white;
            font-size: 20px;
            padding-left: 70px;
        }
        .footer {
            margin-top: 10px;
            border: solid 1px #6e1237;
            background-color: #6e1237;
            height: 40px;
            max-width: 100%;
            padding-top: 20px;
            
        }
    </style>
</head>
<body>
    <div class="header"><span class="header-text">HEADER</span></div>
    <div class="menu"><span class="menu-text">MENU</span></div>
   
    <div class="content-wrapper">

        <div class="sidebar">
        <div class="block1"><span class="aside1">ASIDE 1</span></div>
        <div class="block2"><span class="aside2">ASIDE 2</span></div>
        </div>
        
        <div class="block4"><span class="text4">MAIN CONTENT</span>
        <div class="block5"><span class="text">SECTION 1</span> </div>
        <div class="block6"><span class="text">SECTION 2</span> </div>
        </div>
        
        <div class="block3"></div>

    </div>
    
    <div class="footer"><span class="Footer">FOOTER</span></div>
</body>
</html>

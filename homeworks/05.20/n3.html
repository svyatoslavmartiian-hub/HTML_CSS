<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
        }

        .frame1 {
            width: 50vw;
            height: 200px;
            display: flex;
            position: relative;
            overflow: hidden;    
        }

        .frame1 img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 1s ease; 
        }

        .box-text {
            background-color: #fff;
            width: 50vw;
            height: 200px;
            position: relative; 
        }

        .text {
            text-align: center;
            margin-top: 90px;
            position: relative;
            z-index: 2; 
        }

        .box-text::after, .frame1::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.425); 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            z-index: 1;
        }

        .container:hover .box-text::after,
        .container:hover .frame1::after {
            opacity: 1;
        }


        .container:hover .frame1 img {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="frame1">
            <img src="./resources/картинка.png" alt="Зображення">
        </div>
        
        <div class="box-text">
            <div class="text">HELLO, WORLD!</div>
        </div>
    </div>

</body>
</html>

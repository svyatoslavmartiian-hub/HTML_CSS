<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .block1, .block2 {
            display: inline-block;
            width: 400px;
            height: 200px;
            border: 5px solid #620e3f;
            background-color: #862d61;
            margin-top: 5px;
            position: relative;
            z-index: 2;

        }
        .main {
            display: flex;
            justify-content: center;
        }
        .example {
            transition: all 2s ease 0s;
            transform-origin: left;
        }
        .example2 {
            transition: all 2s ease 0s;
            transform-origin: right;
        } 
         .main:hover .example {
            transform: rotateY(25deg) translate(-100px);
         }
         .main:hover .example2 {
            transform: rotateY(-25deg) translate(100px);

            
         }
         .text {
            display: inline-block;
            position: absolute;
            z-index: 1;
            font-size: 30px;
            margin-top: 80px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
         }
    </style>
</head>
<body>
    <div class="main">
        <div class="block1 example"></div>
        <span class="text">HELLO</span>
        <div class="block2 example2"></div>
    </div>
</body>
</html>

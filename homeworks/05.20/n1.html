<!DOCTYPE html>
<html lang="uk">
<head>
    <title>Годинник</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .clock-container {
            width: 400px;
            height: 400px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .clock-face {
            width: 250px;
            height: 250px;
            border: 4px solid #008080;
            border-radius: 50%;
            position: relative;
        }
        /* Новий стиль для центральної точки замість ::after */
        .center-dot {
            width: 12px;
            height: 12px;
            background-color: #008080;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            background-color: #008080;
            border-radius: 4px;
            transform-origin: bottom center;
        }
        .hour-hand {
            width: 6px;
            height: 60px;
            margin-left: -3px;
            animation: rotate-hand 60s linear infinite;
        }
        .minute-hand {
            width: 4px;
            height: 90px;
            margin-left: -2px;
            animation: rotate-hand 5s linear infinite;
        }
        @keyframes rotate-hand {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="clock-face">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="center-dot"></div>
        </div>
    </div>
</body>
</html>

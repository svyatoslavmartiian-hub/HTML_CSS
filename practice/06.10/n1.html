<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e4e4e4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }



        @media (min-width: 601px) {

            .button-2 {
                display: none;
            }
            .container {
                background-color: #ffff;
                display: flex;
                max-width: 1058px;
                margin: 20px 10px;
                border: 1px solid black;
            }

            .uploading {
                display: flex;
                align-items: center;
            }

            .image {
                width: 330px;
                height: 130px;

            }

            .image-container {
                margin: 15px;
            }

            .uploading-1 {
                margin-top: 15px;
                background-color: #d0d6e2;
                padding: 5px;
                padding-right: 70px;
                padding-left: 15px;
                border-left: 1px solid black;
                border-bottom: 1px solid black;
                border-top: 1px solid black;
            }

            .time {
                margin-top: 15px;
                background-color: #f5f5f5;
                width: 330px;
                text-align: right;
                border-right: 1px solid black;
                border-bottom: 1px solid black;
                border-top: 1px solid black;
                
            }



            .time p:first-child {
                margin: 5px 15px;
            }

            .button {
                background-color: #3c5a9a;
                color: white;
                margin-left: 15px;
                margin-top: 15px;
                padding: 6px 40px;
            }

            .title {
                margin-top: 25px;
                display: flex;
                flex-direction: column;
                gap: 25px;
            }

            .title p:first-child {
                font-size: 18px;
                font-weight: 600;
            }

            .title p:nth-child(2) {
                font-size: 13px;
                color: rgba(0, 0, 0, 0.733);
            }


        }

        @media (max-width: 600px) {

            .button {
                display: none;
            }
            .container {
                display: flex;
                flex-direction: column;
                margin: 20px;
                border: 1px solid black;
                padding: 20px;
            }

            .image {
                width: 520px;
                height: 220px;
            }

            .uploading {
                display: flex;
                align-items: center;
            }

            .uploading-1 {
                margin-top: 15px;
                background-color: #d0d6e2;
                padding: 5px;
                padding-right: 50px;
                padding-left: 15px;
                border-left: 1px solid black;
                border-bottom: 1px solid black;
                border-top: 1px solid black;
            }

            .time {
                margin-top: 15px;
                background-color: #f5f5f5;
                width: 329px;
                text-align: right;
                border-right: 1px solid black;
                border-bottom: 1px solid black;
                border-top: 1px solid black;
                padding: 5px;
                padding-right: 15px;
                
                
            }

            .button-2 {
                background-color: #3c5a9a;
                color: white;
                margin-top: 15px;
                padding: 6px 40px;
                max-width: 520px;
                display: flex;
                justify-content: center;
                font-size: 15px;
                font-weight: 600;

            }

            .title {
                margin-top: 15px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .title p:first-child {
                font-size: 20px;
                font-weight: 600;
            }

            .title p:nth-child(2) {
                font-size: 13px;
                color: rgba(0, 0, 0, 0.733);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container"><img src="./resources/loading.png" alt="loading" class="image"></div>
        <div class="main-content">
            <div class="uploading">
                <div class="uploading-1">
                    <p>UPLOADING 40%</p>
                </div>
                <div class="time">
                    <p>About 23 minutes remaining</p>
                </div>
                <div class="button"><p>DONE</p></div>
            </div>

            <div class="title">
                <p>Title of video</p>
                <p>* Your video is still uploading. Please keep this page open untikit's done.</p>
            </div>
            <div class="button-2"><p>DONE</p></div>
        </div>
    
    </div>
    
</body>
</html>

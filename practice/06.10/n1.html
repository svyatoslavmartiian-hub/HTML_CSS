<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            margin: 30px;
            width: 100vw;
            height: auto;
            border: 1px solid rgba(0, 0, 0, 0.5);
            box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.2);
            
        }
        button {
            display: flex;
            float: right;
            /* margin-bottom: 50px; */
        }
        img {
            display: inline-block;
            margin: 1.2em;
        }
        .loading {
            margin-top: 1.5em;
            display: inline-block;
            width: max-content;
            height: max-content;
            border: 1px solid blue;
            overflow: hidden;
        }
        .text-loading-1 {
            display: inline-block;
            padding: 3px 50px 3px 7px;
            background-color: rgb(190, 190, 190);

        }
        .text-loading-2 {
            display: inline-block;
            margin-left: 100px;
            
        }
        .text {
            height: max-content;
            display: inline-block;
            margin-top: 40px;
        }
        .main {
            display: flex;
            flex-direction: column;
        }
        .text3 {
            font-size: 1.5em;
            /* padding-top: 4em; */
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="./resources/loading.png" alt="">
        <div class="main">
            <div class="loading">
                <span class="text-loading-1">UPLOADING 40%</span>
                <span class="text-loading-2">About 23 minutes remaininng</span>
            </div>
            <div class="text">
                <span class="text3">Title of video</span>
                <span class="text4"></span>
            </div>
        </div>
        
        <!-- <button class="button"></button> -->
    </div>
</body>
</html>

        .container {
            display: grid;
            grid-template-columns: repeat(12,1fr);
            grid-template-rows: 30vh auto 30vh;
            background-color: aliceblue;
            border: 1px solid black;
        }

        header {
            grid-column: span 2;
        }



    </style>
</head>

        </main>
        <footer>
            <div><img src="./resources/картинка.jpg" alt=""></div>
            <div>
                <span>Author</span>
                <span>Geoff Graham</span>
            </div>
            <div>
                <span>49 Comments</span>

            </div>
            <div>
                <span>Published</span>
                <span>Nov 11, 2018</span>
            </div>
            <div>
                <span>Updated</span>

            </div>

    </div>

</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;

        }
        body {
            display: flex;
            justify-content: center;
            background-color: antiquewhite;
        }

        .container {
            width: 100vw;
            max-width: 1200px;
            min-width: 320px;

            min-height: 100vh;
            height: auto;

            display: flex;
            flex-direction: column;

        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;

            background-color: darkblue;
            color: gold;
            flex-basis: 10vh;

        }



        main {
            flex-grow: 11;

            display: flex;
            flex-direction: row;
            flex-shrink: auto;
        }
        aside:first-child, aside:last-child {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-basis: 20%;
            color: gold;

        }

        aside:first-child {
            background-color: coral;
            color: gold;
        }
        aside:last-child {
            background-color: darkmagenta;
            color: gold;
        }
        main>section {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-grow: 11;
            flex-shrink: auto;

            background-color: gray;
            color: gold;
        }
        footer {
            display: flex;
            align-items: center;
            justify-content: center;

            background-color: darkgreen;
            color: gold;
        }
        @media screen and (max-width:960px) and (min-width:570px) {
            aside:last-child {
                display: none;
            }
            
            aside:first-child {
                flex-basis: 30%;
            }
            section {
                flex-basis: 70%;
            }
        }
        @media screen and (max-width:570px) {
            main {
                flex-direction: column;
            }

            main>aside {
                flex-basis: 20vh;
            }

            main>section {
                flex-basis: auto;
                order: -1;
            }

            main>section+aside {
                display: none;
            }
        } 
            
        
    </style>

</head>
<body>
    <div class="container">
        <header>HEADER</header>
        <main>
            <aside>LEFT SIDE</aside>
            <section>MIDDLE SECTION</section>
            <aside>RIGHT SIDE</aside>
        </main>
        <footer>FOOTER</footer>
    </div>
</body>
</html>

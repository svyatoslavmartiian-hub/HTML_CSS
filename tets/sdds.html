<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .frame {
            border: 2px slateblue solid;
            overflow: hidden;
        }
        .frame img {
            width: 100px;
            height: 100px;
            
            transition: transform 1s ease;
        }
        .frame:hover img {
            transform: scale(11.2);
        }
    </style>
</head>
<body>
    <div class="frame">
        <img src="../lessons/3_graphics/resourser/emoji.webp" alt="">
    </div>
</body>
</html>
